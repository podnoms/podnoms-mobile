# Builds the production .aab on the self-hosted runner (builds stay on our own
# machine, never on EAS's or GitHub's builders) and sends it to Google Play's
# internal testing track. EAS still holds the keystore and bumps the version
# code; the upload goes straight to Play's API, with the key from a secret.
# Setup and secrets are in README.md, "Releasing".
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, so two runs never claim the same version code.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write # to create the GitHub release

jobs:
  release:
    runs-on: [self-hosted, linux, podnoms-android-runner]
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The version eas-cli is run with, whatever the runner's image has.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json

      - name: Build
        run: bunx eas-cli build --platform android --profile production --local --non-interactive --output build.aab

      # The Play upload below reads the key from this file.
      - name: Write the Play service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 -d > play-service-account.json

      # Straight to the Play Developer API from the runner: eas submit runs on
      # EAS's servers and waits in their queue.
      - name: Submit to Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-service-account.json
          packageName: com.podnoms.android
          releaseFiles: build.aab
          track: internal
          status: completed

      # An APK to sideload, attached to the GitHub release. production-apk
      # doesn't bump the version code, so it has the same one as the .aab.
      - name: Build APK
        run: bunx eas-cli build --platform android --profile production-apk --local --non-interactive --output podnoms-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            build.aab
            podnoms-${{ github.ref_name }}.apk
          retention-days: 14

      # A pushed tag only shows under Tags; this makes it a release, with the APK.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: podnoms-${{ github.ref_name }}.apk

      # The runner keeps its workspace between runs.
      - name: Clean up
        if: always()
        run: rm -f build.aab *.apk google-services.json play-service-account.json
