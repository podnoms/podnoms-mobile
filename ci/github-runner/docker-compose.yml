# podnoms-mobile's self-hosted GitHub Actions runner: a second container from
# the image intellibrand-go's runner builds (Java 17, Android SDK, eas-cli),
# registered to this repo with its own label, caches and work dir.
# `docker compose up -d` here; set up .env from .env.example first.
services:
  runner:
    # Built by /srv/wasp-dev/intellibrand-go/machines/github-runner
    # (`docker compose build` there to update it).
    image: github-runner-runner:latest
    restart: unless-stopped
    container_name: podnoms-mobile-runner
    environment:
      GITHUB_REPO: podnoms/podnoms-mobile
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: podnoms-mobile-linux
      RUNNER_LABELS: self-hosted,linux,x64,podnoms-android
      GRADLE_USER_HOME: /cache/gradle
      npm_config_cache: /cache/npm
      BUN_INSTALL_CACHE_DIR: /cache/bun

    # No Docker socket: EAS local builds don't need one, and this repo is public.
    volumes:
      - ${RUNNER_DATA}/cache/gradle:/cache/gradle
      - ${RUNNER_DATA}/cache/npm:/cache/npm
      - ${RUNNER_DATA}/cache/bun:/cache/bun
      - ${RUNNER_DATA}/work:/home/runner/actions-runner/_work
      # The runner's own install, so its auto-updater can write new binaries.
      - ${RUNNER_DATA}/runner:/home/runner/actions-runner
      # EAS local builds write several GB under /tmp.
      - ${RUNNER_DATA}/tmp:/tmp

    shm_size: "4gb"
